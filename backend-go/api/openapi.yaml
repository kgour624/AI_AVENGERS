openapi: "3.0.3"
info:
  title: AI Avengers API
  version: "1.0.0"
  description: |
    Multi-agent domain expert platform.
    Single source of truth for all API contracts.
    Backend (Go) and Frontend (TypeScript) both generate types from this file.

servers:
  - url: /api/v1
    description: API v1

# ============================================================
# SHARED COMPONENTS
# ============================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # --- Envelope ---
    ApiMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: UNAUTHORIZED
        message:
          type: string
          example: Invalid or expired token
        details:
          type: object
          additionalProperties:
            type: string

    # --- Auth ---
    User:
      type: object
      required: [id, email, fullName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum: [admin, client]
        totpEnabled:
          type: boolean
          default: false

    TokenPair:
      type: object
      required: [accessToken, expiresInSeconds]
      properties:
        accessToken:
          type: string
        expiresInSeconds:
          type: integer
          example: 900

    AuthResponse:
      type: object
      required: [user, tokenPair]
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokenPair:
          $ref: '#/components/schemas/TokenPair'

    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        totpCode:
          type: string
          description: 6-digit Google Authenticator code

    # --- Experts ---
    Expert:
      type: object
      required: [id, name, slug, domain, description, totalChunks, totalTopics, avgDepthLevel, avgRating, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        domain:
          type: string
        description:
          type: string
        totalChunks:
          type: integer
        totalTopics:
          type: integer
        avgDepthLevel:
          type: number
          format: float
        avgRating:
          type: number
          format: float
        createdAt:
          type: string
          format: date-time

    ExpertTopic:
      type: object
      required: [topic, depthLevel, chunkCount, complexityCeiling]
      properties:
        topic:
          type: string
        depthLevel:
          type: integer
          minimum: 1
          maximum: 5
        chunkCount:
          type: integer
        complexityCeiling:
          type: string
          enum: [basic, intermediate, advanced, expert, master]

    ExpertTopicsResponse:
      type: object
      required: [expertId, topics, total]
      properties:
        expertId:
          type: string
          format: uuid
        topics:
          type: array
          items:
            $ref: '#/components/schemas/ExpertTopic'
        total:
          # WHY string: backend uses fmt.Sprintf("%d", len(topics))
          # Changing to integer would require backend change.
          # Documented here so it's visible and can be fixed intentionally.
          type: string
          example: "5"

    # --- Projects ---
    ProjectExpert:
      type: object
      required: [expertId, expertName, domain, addedAt, isActive]
      properties:
        expertId:
          type: string
          format: uuid
        expertName:
          type: string
        domain:
          type: string
        addedAt:
          type: string
          format: date-time
        isActive:
          type: boolean

    Project:
      type: object
      required: [id, clientId, name, description, status, repoConnected, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, completed, archived]
        repoUrl:
          type: string
        repoProvider:
          type: string
          enum: [github, gitlab]
        repoConnected:
          type: boolean
        repoLastSync:
          type: string
          format: date-time
        experts:
          # WHY optional: GET /projects list does NOT load experts.
          # Only GET /projects/:id loads experts.
          # Frontend must handle experts being undefined on list items.
          type: array
          items:
            $ref: '#/components/schemas/ProjectExpert'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 500
        description:
          type: string

    # --- Chats ---
    Chat:
      type: object
      required: [id, projectId, title, messageCount, isArchived, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        messageCount:
          type: integer
        isArchived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateChatRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string

    # --- Messages ---
    Citation:
      type: object
      required: [chunkId, text, score]
      properties:
        chunkId:
          type: string
          format: uuid
        text:
          type: string
        score:
          type: number
          format: float

    Message:
      type: object
      required: [id, chatId, role, content, turnNumber, createdAt]
      properties:
        id:
          type: string
          format: uuid
        chatId:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        turnNumber:
          type: integer
        expertId:
          type: string
          format: uuid
        decisionMode:
          type: string
          enum: [ASK, WARN, PUSH_BACK, REFUSE, ADVISE]
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        confidence:
          type: number
          format: float
        gateStopped:
          type: integer
          minimum: 0
          maximum: 5
        warningText:
          type: string
        clarifyingQuestions:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    SendMessageRequest:
      type: object
      required: [message, expertIds]
      properties:
        message:
          type: string
        expertIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1

    # --- SSE Events ---
    SSEThinkingEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [thinking]
        data:
          type: object
          required: [message, experts]
          properties:
            message:
              type: string
            experts:
              type: integer

    SSECompleteEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [complete]
        data:
          type: object
          required: [expertId, expertName, domain, mode, content, citations, confidence, gateStopped]
          properties:
            expertId:
              type: string
              format: uuid
            expertName:
              type: string
            domain:
              type: string
            mode:
              type: string
              enum: [ASK, WARN, PUSH_BACK, REFUSE, ADVISE]
            content:
              type: string
            citations:
              type: array
              items:
                $ref: '#/components/schemas/Citation'
            confidence:
              type: number
              format: float
            gateStopped:
              type: integer
              minimum: 0
              maximum: 5
            warning:
              type: string
            questions:
              type: array
              items:
                type: string
            error:
              type: string

    SSESynthesisEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [synthesis]
        data:
          type: object
          required: [agreements, contradictions, summary]
          properties:
            agreements:
              type: array
              items:
                type: string
            contradictions:
              type: array
              items:
                type: object
                required: [topic, expertA, positionA, expertB, positionB]
                properties:
                  topic:
                    type: string
                  expertA:
                    type: string
                  positionA:
                    type: string
                  expertB:
                    type: string
                  positionB:
                    type: string
            summary:
              type: string

    SSEDoneEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [done]
        data:
          type: object
          required: [turnNumber, durationMs]
          properties:
            turnNumber:
              type: integer
            durationMs:
              type: integer

    SSEErrorEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [error]
        data:
          type: object
          required: [message]
          properties:
            message:
              type: string

    # --- Ratings ---
    RateRequest:
      type: object
      required: [score]
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        feedback:
          type: string
        feedbackType:
          type: string
          enum: [accepted, rejected, modified, ignored]
        codeExecuted:
          type: boolean
        executionSuccess:
          type: boolean
        errorMessage:
          type: string

# ============================================================
# PATHS
# ============================================================
paths:

  # --- Auth ---
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/AuthResponse'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
        '409':
          description: Email already registered

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/AuthResponse'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
        '401':
          description: Invalid credentials

  /auth/admin/login:
    post:
      operationId: adminLogin
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Admin login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/AuthResponse'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/TokenPair'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out

  # --- Experts ---
  /experts:
    get:
      operationId: listExperts
      tags: [experts]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of active experts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Expert'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'

  /experts/{id}:
    get:
      operationId: getExpert
      tags: [experts]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Expert details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/Expert'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'

  /experts/{id}/topics:
    get:
      operationId: getExpertTopics
      tags: [experts]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Expert capability topics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/ExpertTopicsResponse'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'

  # --- Projects ---
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: |
            List of client's projects.
            NOTE: experts[] is NOT included in list response.
            Only GET /projects/{id} includes experts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
    post:
      operationId: createProject
      tags: [projects]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/Project'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project with experts loaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/Project'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'

  /projects/{id}/experts:
    post:
      operationId: addProjectExpert
      tags: [projects]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expertId]
              properties:
                expertId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Expert added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: expert added

  /projects/{id}/experts/{expertId}:
    delete:
      operationId: removeProjectExpert
      tags: [projects]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: expertId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Expert removed

  /projects/{id}/chats:
    get:
      operationId: listChats
      tags: [chats]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of chats for project
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Chat'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
    post:
      operationId: createChat
      tags: [chats]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatRequest'
      responses:
        '201':
          description: Chat created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/Chat'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'

  # --- Chats ---
  /chats/{id}:
    get:
      operationId: getChat
      tags: [chats]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chat details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/Chat'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'

  /chats/{id}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Messages in chat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
    post:
      operationId: sendMessage
      tags: [messages]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          multipart/form-data:
            schema:
              type: object
              required: [message, expertIds]
              properties:
                message:
                  type: string
                expertIds:
                  type: string
                  description: JSON array of expert UUIDs
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: |
            SSE stream. Events are newline-delimited JSON.
            Each line: data: {"type": "...", "data": {...}}
            Event types: thinking, complete, synthesis, done, error
          content:
            text/event-stream:
              schema:
                type: string

  # --- Ratings ---
  /messages/{id}/rate:
    post:
      operationId: rateMessage
      tags: [messages]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateRequest'
      responses:
        '200':
          description: Rating recorded
