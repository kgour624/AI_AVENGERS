# Nginx config for React SPA (frontend container)
# WHY separate from main nginx.conf:
# This runs inside the frontend container itself.
# Main nginx.conf (in /nginx/) is the reverse proxy that
# routes between frontend and api containers.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets aggressively (they have content hashes in filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing: all routes return index.html
    # WHY: React Router handles routing client-side.
    # Without this, refreshing /projects/123 returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
