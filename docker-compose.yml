version: '3.9'

# Development Docker Compose
# Usage:
#   cp backend-go/.env.example .env   # fill in JWT_SECRET, OPENROUTER_API_KEY, ENCRYPTION_KEY
#   docker-compose up -d
#   docker-compose logs -f api

services:
  # ============================================================
  # Database Migration Runner
  # WHY separate service:
  # Runs ONCE before api starts. Applies all pending migrations.
  # Exits with code 0 on success. api waits for it to complete.
  # golang-migrate tracks applied versions — safe to run repeatedly.
  # ============================================================
  migrate:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    command: ["./migrate", "up"]
    environment:
      - DATABASE_URL=postgres://avengers:${POSTGRES_PASSWORD:-avengers_pass}@postgres:5432/ai_avengers?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    # WHY restart: no — migrations are one-shot.
    # Running them again on crash is wrong (could indicate a real problem).
    restart: no
    networks:
      - avengers-network

  # ============================================================
  # Go Backend API
  # ============================================================
  api:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_ENV=development
      - DATABASE_URL=postgres://avengers:${POSTGRES_PASSWORD:-avengers_pass}@postgres:5432/ai_avengers?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - ML_SIDECAR_URL=http://ml-sidecar:8001
      - JWT_SECRET=${JWT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOG_LEVEL=info
      # OAuth (optional — PAT-based connect works without these)
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITLAB_CLIENT_ID=${GITLAB_CLIENT_ID:-}
      - GITLAB_CLIENT_SECRET=${GITLAB_CLIENT_SECRET:-}
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      # CORS: allow dev frontend. Add more origins comma-separated.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-sidecar:
        condition: service_started
      migrate:
        # WHY service_completed_successfully:
        # migrate exits with code 0 after applying migrations.
        # api must not start until migrations are done.
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - avengers-network

  # ============================================================
  # Frontend — Vite Dev Server
  # WHY dev server not nginx:
  # HMR (Hot Module Replacement) for fast development iteration.
  # Production uses nginx to serve built static files.
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source for HMR — changes reflect instantly
      - ./frontend:/app
      # Exclude node_modules from mount — use container's version
      # WHY: Host OS node_modules may differ from container (e.g. linux vs mac)
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - avengers-network

  # ============================================================
  # Python ML Sidecar
  # WHY separate service: ML models are large, Python-native.
  # Stateless — can scale independently from API.
  # ============================================================
  ml-sidecar:
    build:
      context: ./ml-sidecar
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ml-models:/root/.cache/huggingface  # Cache downloaded models
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - avengers-network

  # ============================================================
  # PostgreSQL with pgvector
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=avengers
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-avengers_pass}
      - POSTGRES_DB=ai_avengers
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avengers -d ai_avengers"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - avengers-network

  # ============================================================
  # Redis
  # Used for: L1 memory, JWT refresh tokens, rate limiting, OAuth state
  # ============================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - avengers-network

volumes:
  postgres-data:
  redis-data:
  ml-models:  # Persist downloaded model weights

networks:
  avengers-network:
    driver: bridge
