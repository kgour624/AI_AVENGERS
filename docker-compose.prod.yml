version: '3.9'

# Production Docker Compose
# WHY separate from development:
# - No code volume mounts (immutable containers)
# - Resource limits (prevent runaway costs)
# - Restart policies (auto-recovery)
# - No exposed ports except through nginx
# - Health checks with proper intervals

services:
  # ============================================================
  # Nginx Reverse Proxy
  # WHY nginx: SSL termination, rate limiting, static file serving
  # ============================================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    restart: always
    networks:
      - avengers-network

  # ============================================================
  # Go Backend API
  # ============================================================
  api:
    image: ${REGISTRY:-ghcr.io}/ai-avengers/backend:${VERSION:-latest}
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - ML_SIDECAR_URL=http://ml-sidecar:8001
      - JWT_SECRET=${JWT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOG_LEVEL=info
      - RATE_LIMIT_PER_IP=100
      - RATE_LIMIT_PER_USER=20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    # Resource limits
    # WHY: Prevent one service from consuming all server resources
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - avengers-network

  # ============================================================
  # Python ML Sidecar
  # WHY resource limits: ML models use significant memory
  # bge-base-en-v1.5 (~500MB) + bge-reranker-base (~280MB) = ~800MB
  # ============================================================
  ml-sidecar:
    image: ${REGISTRY:-ghcr.io}/ai-avengers/ml-sidecar:${VERSION:-latest}
    build:
      context: ./ml-sidecar
      dockerfile: Dockerfile
    volumes:
      - ml-models:/root/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8001/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s  # Models take time to load
    networks:
      - avengers-network

  # ============================================================
  # PostgreSQL with pgvector
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-avengers}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-ai_avengers}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avengers} -d ${POSTGRES_DB:-ai_avengers}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - avengers-network

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - avengers-network

volumes:
  postgres-data:
  redis-data:
  ml-models:

networks:
  avengers-network:
    driver: bridge
