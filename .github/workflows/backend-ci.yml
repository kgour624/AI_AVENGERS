name: backend-ci

# T3: the Go backend had no CI at all, so a broken build or a failed unit test
# could reach main. This workflow makes build/vet/test the gate, and keeps the
# golden-set eval as an explicit, opt-in run (it needs a live server + DB, which
# are supplied through secrets on workflow_dispatch, never hard-coded).

on:
  push:
    branches: [main]
    paths:
      - "backend-go/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend-go/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend-go/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./... -count=1

  # Golden-set eval. Deterministic by default (reproducible); pass judge=true to
  # layer the LLM judge on top (one model call per case). Requires a running
  # server and a database, provided via secrets/vars — the job is skipped when
  # they are absent instead of failing the pipeline.
  golden-eval:
    if: github.event_name == 'workflow_dispatch' && vars.EVAL_BASE_URL != ''
    runs-on: ubuntu-latest
    needs: build-test
    defaults:
      run:
        working-directory: backend-go
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: avengers
          POSTGRES_PASSWORD: avengers
          POSTGRES_DB: ai_avengers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avengers"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend-go/go.sum
      - name: Run golden-set eval (CI merge gate)
        env:
          EVAL_BASE_URL: ${{ vars.EVAL_BASE_URL }}
          EVAL_TOKEN: ${{ secrets.EVAL_TOKEN }}
          EVAL_CHAT_ID: ${{ vars.EVAL_CHAT_ID }}
          DATABASE_URL: postgres://avengers:avengers@localhost:5432/ai_avengers?sslmode=disable
        run: |
          set -euo pipefail
          if [ -z "${EVAL_TOKEN:-}" ] || [ -z "${EVAL_CHAT_ID:-}" ]; then
            echo "::warning::EVAL_TOKEN/EVAL_CHAT_ID not configured — skipping golden eval"
            exit 0
          fi
          go run ./cmd/eval -suite chat -suite adversarial
